<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HIMMA COFFEE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=Poppins:wght=400;600&family=Noto+Sans+Ethiopic:wght=400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* PASTE YOUR ACTIVE RE-DEPLOYED WEB APP LINK HERE */
            --google-sheet-url: "https://script.google.com/macros/s/AKfycbwtnBbKPoDM2LhVelwwdOr7o3DQI8ZOgfyq51GuK0VOc8Wj_dSAAdD1VNJRCyI5Mt7i/exec";
            
            --hotel-en-1: "HIMMA";
            --hotel-en-2: "COFFEE";
            --hotel-en-3: ""; 
            --hotel-am-1: "Dቦራ";
            --hotel-am-2: "ጁስ እና ";
            --hotel-am-3: "በርገር";
            --word-1-color: #ED7014;
            --word-2-color: #028A0F;
            --word-3-color: #FFBA00; 
            --nav-bg-color: #ffffff;
            --call-btn-color: #ED7014;
            --header-bg: #564C4D;
            --page-bg: #ffffff;
            --price-color: #3E5F34;
            --ing-color: #4A0000;
            --brand-primary: #E56717;
            --phone-number: "+251954954591";
            --admin-user: "himma";
        }

        /* Base Resets */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--page-bg); color: #333; font-family: 'Poppins', 'Noto Sans Ethiopic', sans-serif; padding-bottom: 100px; }
        
        /* Isolated App Loader Overlay */
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; transition: opacity 0.4s ease; }
        .loader-welcome-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--brand-primary); margin-bottom: 4px; }
        .loader-welcome-subtitle { font-family: 'Noto Sans Ethiopic', sans-serif; font-size: 18px; font-weight: 700; color: var(--header-bg); margin-bottom: 30px; }
        .spinner { width: 45px; height: 45px; border: 5px solid #eee; border-top: 5px solid var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-text { font-size: 24px; font-weight: 700; color: var(--brand-primary); margin-top: 15px; font-family: 'Poppins', sans-serif; }

        /* Navigation Header Blocks */
        .header { background: var(--header-bg); padding: 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; height: 130px; }
        .header-left-menu { cursor: pointer; font-size: 28px; padding: 10px; color: white; width: 50px; flex-shrink: 0; }
        .logo-container-block { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; flex-shrink: 0; margin-right: 10px; }
        .logo-img { height: 80px; width: 80px; object-fit: contain; }
        .header-center-area { text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .header h1 { font-family: 'Playfair Display'; font-size: 22px; font-weight: 800; display: inline-block; white-space: nowrap; }
        .w1 { color: var(--word-1-color); }
        .w2 { color: var(--word-2-color); }
        .w3 { color: var(--word-3-color); }
        .lang-btn-style { background: white; color: var(--header-bg); border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; flex-shrink: 0; font-size: 13px; }
        
        /* Category Bar Scroller Layout */
        .nav-bar { display: flex; overflow-x: auto; padding: 15px 10px; background: var(--nav-bg-color); position: sticky; top: 130px; z-index: 900; border-bottom: 1px solid #eee; min-height: 195px; scrollbar-width: none; gap: 15px; }
        .nav-bar::-webkit-scrollbar { display: none; }
        .nav-item { text-align: center; min-width: 140px; opacity: 0.5; cursor: pointer; flex-shrink: 0; border-bottom: 4px solid transparent; padding-bottom: 8px; }
        .nav-item.active { opacity: 1; font-weight: bold; color: var(--brand-primary); border-bottom-color: var(--brand-primary); }
        .nav-item img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto; }

        /* Grid Containment For Menu Item Listing */
        .container { padding: 15px; width: 100%; max-width: 100%; display: block; box-sizing: border-box; }
        .card { display: flex; align-items: flex-start; background: #ffffff; border-radius: 12px; margin-bottom: 15px; padding: 12px; border: 1px solid #f0f0f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; cursor: pointer; width: 100%; box-sizing: border-box; } 
        .food-img { width: 110px; height: 110px; border-radius: 10px; object-fit: cover; margin-right: 15px; flex-shrink: 0; }
        .food-info-area { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .food-title { color: var(--brand-primary); font-size: 19px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; word-wrap: break-word; }
        .food-ing { font-size: 13px; color: var(--ing-color); font-style: italic; line-height: 1.3; word-wrap: break-word; margin-bottom: 6px; }
        .price-tag { font-weight: bold; color: var(--price-color); font-size: 17px; }

        /* Unified Layout Overlays */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 4000; align-items: center; justify-content: center; padding: 15px; }
        .modal { background: #ffffff; padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; position: relative; box-sizing: border-box; }
        #modalImgHD { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 10px; margin-bottom: 15px; display: block; }
        .close-x { position: absolute; top: 10px; right: 20px; font-size: 35px; cursor: pointer; color: #000000; z-index: 10; }

        /* Fixed Sticky Order Calling Control */
        .call-order-btn { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: var(--call-btn-color); color: #ffffff; padding: 16px 35px; border-radius: 50px; text-decoration: none; z-index: 2000; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); white-space: nowrap; }

        /* Separate Isolated Admin Matrix */
        #adminDashboard { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 3000; padding: 15px; overflow-y: auto; box-sizing: border-box; }
        .admin-section { border: 1px solid #ddd; padding: 15px; border-radius: 10px; margin-bottom: 25px; background: #fafafa; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #ffffff; text-align: center; font-size: 14px; margin-top: 10px; }
        .cat-row { background: #ffffff; padding: 15px; border: 1px solid #eee; margin-bottom: 10px; border-radius: 8px; }
        .cat-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 12px 5px; border-bottom: 1px solid #eee; vertical-align: top; }
        .price-box { width: 90px !important; font-weight: bold; text-align: center; border: 2px solid var(--brand-primary) !important; }
        input, select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; background: #fff; display: block; box-sizing: border-box; }
    </style>
</head>

    <div class="spinner"></div>
    <div id="progressText" class="progress-text">1%</div>
    <p id="loadText" style="margin-top:10px; font-size:13px; font-weight:600; color:#777;">Securing background connection traces...</p>
</div>
